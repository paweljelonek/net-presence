name: Tests

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  test:
    name: Run xUnit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test
